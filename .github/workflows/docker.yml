name: Build Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build the Docker image
      - name: Build Docker image
        run: docker build -t job-email-automation:latest .

      # 3. Optional: Run the container to verify port 5000 exposure
      - name: Run container
        run: docker run -d -p 5000:5000 --name job-email-automation:latest
