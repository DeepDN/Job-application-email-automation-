<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Email Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-center mb-4">Job Application Email Automation</h1>
                <p class="text-center text-muted">Free, open-source tool to automate your job application emails</p>
                
                <div class="card">
                    <div class="card-body">
                        <form id="emailForm">
                            <div class="mb-3">
                                <label class="form-label">Gmail Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Gmail App Password</label>
                                <input type="password" class="form-control" id="password" required>
                                <div class="form-text">
                                    <a href="https://support.google.com/accounts/answer/185833" target="_blank">
                                        How to generate Gmail App Password
                                    </a>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Upload Companies Excel File</label>
                                <input type="file" class="form-control" id="fileInput" accept=".xlsx" required>
                                <div class="form-text">
                                    <a href="/template" download>Download Excel Template</a>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Send Emails</button>
                        </form>
                        
                        <div id="result" class="mt-3"></div>
                    </div>
                </div>
                
                <div class="mt-4 text-center">
                    <p class="text-muted">
                        <a href="https://github.com/DeepDN/Job-application-email-automation-" target="_blank">
                            View on GitHub
                        </a> | 
                        Made with ❤️ for job seekers
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file');
                return;
            }
            
            // Upload file
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const uploadResponse = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const uploadResult = await uploadResponse.json();
                
                if (!uploadResponse.ok) {
                    throw new Error(uploadResult.error);
                }
                
                // Send emails
                const emailData = {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    filename: uploadResult.filename
                };
                
                document.getElementById('result').innerHTML = '<div class="alert alert-info">Sending emails...</div>';
                
                const emailResponse = await fetch('/send-emails', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                });
                
                const emailResult = await emailResponse.json();
                
                if (emailResponse.ok) {
                    document.getElementById('result').innerHTML = 
                        `<div class="alert alert-success">
                            Emails sent successfully!<br>
                            Sent: ${emailResult.sent}, Failed: ${emailResult.failed}, Skipped: ${emailResult.skipped}
                        </div>`;
                } else {
                    throw new Error(emailResult.error);
                }
                
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
