version: '3.8'

services:
  app:
    build: .
    container_name: job-email-app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://jobapp:password@db:5432/jobapp_db
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
      - ./resumes:/app/resumes
      - ./logs:/app/logs
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: job-email-db
    environment:
      - POSTGRES_DB=jobapp_db
      - POSTGRES_USER=jobapp
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
